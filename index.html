<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgendaCal - Gerenciador de Eventos</title>
    <meta name="description" content="Gerenciador de eventos com notificações, integração WhatsApp e tema escuro">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>
    <div class="notification" id="notification">
        <button id="stopAlarm" class="btn btn-danger">Parar Alarme</button>
    </div>

    <div class="container">
        <header class="header">
            <div class="header-content">
                <h1 class="header-title">AgendaCal</h1>
                <div class="header-actions">
                    <button id="toggle-theme" class="btn btn-icon" aria-label="Alternar tema">
                        <span class="theme-icon">🌙</span>
                    </button>
                    <button id="trash-button" class="btn btn-icon trash-button" onclick="eventManager.openTrash()" title="Abrir Lixeira">
                        🗑️
                        <span class="trash-count" id="trash-count" style="display: none">0</span>
                    </button>
                    <button id="export-pdf" class="btn btn-secondary" onclick="exportarPDF()">
                        <span class="icon">📄</span>
                        Exportar PDF
                    </button>
                    <button id="backup" class="btn btn-secondary" onclick="fazerBackup()">
                        <span class="icon">💾</span>
                        Backup
                    </button>
                    <button id="import" class="btn btn-secondary" onclick="importarBackup()">
                        <span class="icon">📥</span>
                        Importar
                    </button>
                </div>
            </div>
        </header>

        <main class="main-content">
            <section class="form-section card fade-in">
                <h2 class="section-title">Novo Evento</h2>
                <form id="evento-form" class="form">
                    <div class="form-group">
                        <label for="nome" class="form-label">Nome</label>
                        <input type="text" id="nome" name="nome" class="form-input" required 
                               placeholder="Digite seu nome">
                    </div>

                    <div class="form-group">
                        <label for="titulo" class="form-label">Título do Evento</label>
                        <input type="text" id="titulo" name="titulo" class="form-input" required 
                               placeholder="Digite o título do evento">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="dataHora" class="form-label">Data e Hora</label>
                            <input type="datetime-local" id="dataHora" name="dataHora" class="form-input" required>
                        </div>

                        <div class="form-group">
                            <label for="prioridade" class="form-label">Prioridade</label>
                            <select id="prioridade" name="prioridade" class="form-input" required>
                                <option value="high">Alta</option>
                                <option value="medium">Média</option>
                                <option value="low">Baixa</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="local" class="form-label">Local</label>
                        <input type="text" id="local" name="local" class="form-input" 
                               placeholder="Digite o local do evento">
                    </div>

                    <div class="form-group">
                        <label for="link" class="form-label">Link (opcional)</label>
                        <input type="url" id="link" name="link" class="form-input" 
                               placeholder="https://exemplo.com">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="repeticao" class="form-label">Repetição</label>
                            <select id="repeticao" name="repeticao" class="form-input">
                                <option value="none">Não repetir</option>
                                <option value="daily">Diariamente</option>
                                <option value="weekly">Semanalmente</option>
                                <option value="monthly">Mensalmente</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="numeroWhatsapp" class="form-label">WhatsApp (DDD + Número)</label>
                            <input type="tel" id="numeroWhatsapp" name="numeroWhatsapp" class="form-input" 
                                   pattern="[0-9]{2}[0-9]{9}" placeholder="11999999999" 
                                   title="Digite o DDD e o número (11 dígitos)">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="descricao" class="form-label">Descrição</label>
                        <textarea id="descricao" name="descricao" class="form-input" rows="4" 
                                 placeholder="Detalhes adicionais do evento"></textarea>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">
                            <span class="icon">✨</span>
                            Adicionar Evento
                        </button>
                    </div>
                </form>
            </section>

            <section class="events-section">
                <h2 class="section-title">Eventos</h2>
                <div class="event-filters">
                    <button class="btn btn-filter active" data-filter="all">Todos</button>
                    <button class="btn btn-filter" data-filter="today">Hoje</button>
                    <button class="btn btn-filter" data-filter="week">Esta Semana</button>
                    <button class="btn btn-filter" data-filter="month">Este Mês</button>
                </div>
                <ul id="eventos" class="event-list"></ul>
            </section>
        </main>
    </div>

    <div id="trash-modal" class="modal">
        <div class="modal-content card">
            <div class="modal-header">
                <h3>Lixeira</h3>
                <button class="btn btn-icon" onclick="document.getElementById('trash-modal').classList.remove('show')">❌</button>
            </div>
            <div class="modal-body">
                <ul id="trash-list" class="event-list"></ul>
            </div>
        </div>
    </div>

    <div id="toast" class="toast" role="alert"></div>
    
    <script src="script.js"></script>
</body>
</html>
